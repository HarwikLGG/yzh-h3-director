# dsh-vision-bridge patch layer — inserted after every bundle layer of the
# profile. The row `name` is the plugin package, resolved from the profile's
# node_modules (installed with `dsh plugin --profile web add <dir>`).
#
# 只在这里放"行默认值"；用户随后可在 设置 → 插件 页面（vision-bridge 卡片）
# 里覆盖任意字段，无需重启。未列出的字段走 lib/index.js 中 schema 的默认值。

- insert:
    - id: vision-bridge
      name: 'dsh-vision-bridge'
      config:
        enabled: true
        # 视觉 API Key 的环境变量名（或通过凭据服务存储的同名引用）
        apiKeyEnv: VISION_API_KEY
        # 任意 OpenAI 兼容的 chat/completions 端点
        baseURL: https://api.openai.com/v1
        # 用户指定的视觉模型
        model: gpt-4o-mini
